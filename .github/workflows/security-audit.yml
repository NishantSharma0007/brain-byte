name: Security Audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  audit:
    name: Scan and optionally validate dependency patch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install auditor dependencies
        run: python -m pip install -r requirements-auditor.txt

      - name: Run security scanner
        run: |
          python scanner.py . audit_report.json \
            --markdown-report audit_report.md \
            --sarif-report audit_report.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: audit_report.sarif
          category: codebase-security-auditor

      - name: Generate dependency update patch
        run: python patch_suggestions.py demo_project

      - name: Check whether a patch was generated
        id: patch_file
        run: |
          if [ -f dependency_update_suggestions.patch ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Patch file mila; validation chalegi."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Patch file nahi bani; validation skip hogi."
          fi

      - name: Validate dependency update patch
        if: ${{ steps.patch_file.outputs.exists == 'true' }}
        run: python patch_validator.py demo_project dependency_update_suggestions.patch

      - name: Check patch validation result
        if: ${{ steps.patch_file.outputs.exists == 'true' }}
        run: |
          python - <<'PY'
          import json
          import sys

          with open("patch_validation_report.json", encoding="utf-8") as report_file:
              report = json.load(report_file)

          status = report.get("status")
          print(f"Patch validation status: {status}")

          accepted_statuses = {
              "no_matching_advisories_found_after_patch",
              "patch_applied_no_matching_advisories_found",
          }

          if status not in accepted_statuses:
              print("Validation incomplete, ya updated package par advisory baaki hai.")
              sys.exit(1)

          print("Patch validation successful.")
          PY

      - name: Save reports and patch as downloadable artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-reports
          path: |
            audit_report.json
            audit_report.md
            audit_report.sarif
            dependency_update_suggestions.patch
            patch_validation_report.json
          if-no-files-found: warn