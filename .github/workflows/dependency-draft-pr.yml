name: Propose Dependency Update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose-update:
    name: Validate and open draft PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate dependency patch
        run: python patch_suggestions.py demo_project

      - name: Validate dependency patch
        run: python patch_validator.py demo_project dependency_update_suggestions.patch

      - name: Require successful patch validation
        run: |
          python - <<'PY'
          import json
          import sys

          with open("patch_validation_report.json", encoding="utf-8") as report_file:
              report = json.load(report_file)

          status = report.get("status")
          print(f"Patch validation status: {status}")

          accepted_statuses = {
              "no_matching_advisories_found_after_patch",
              "patch_applied_no_matching_advisories_found",
          }

          if status not in accepted_statuses:
              print("Validation incomplete, or advisories still remain.")
              sys.exit(1)
          PY

      - name: Check and apply patch in workflow copy
        run: |
          git -C demo_project apply --check ../dependency_update_suggestions.patch
          git -C demo_project apply ../dependency_update_suggestions.patch

      - name: Create draft pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: automation/dependency-update
          delete-branch: true
          add-paths: demo_project/requirements.txt
          commit-message: "chore(deps): propose OSV dependency update"
          title: "chore(deps): propose dependency security update"
          body: |
            This draft PR proposes a dependency update generated by the security auditor.

            The patch was checked in a temporary copy against OSV before being applied to this PR branch. Review the workflow run and its validation report before merging.

            - [ ] Review the OSV advisories and affected package.
            - [ ] Confirm the proposed version is compatible with the project.
            - [ ] Run any additional project-specific checks needed.
          draft: always-true

      - name: Upload patch and validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-pr-validation
          path: |
            dependency_update_suggestions.patch
            patch_validation_report.json
          if-no-files-found: warn